name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Personal-data check
        run: python scripts/check_personal_data.py

      - name: Backlog checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_backlog.py --github

      - name: Backlog + pull request checks
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env (not interpolated into the script) to avoid shell injection from the PR body.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_backlog.py --github --base-ref "$BASE_SHA" --pr-number "$PR_NUMBER"
